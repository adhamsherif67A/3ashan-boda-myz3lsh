/**:
  ros__parameters:
    use_sim_time: true
    frame_id: base_link
    odom_frame_id: odom
    # The ExternalNav validator owns TF, so rejected tracking jumps cannot
    # move the RViz robot or reach ArduSub. Raw odometry remains inspectable.
    publish_tf: false
    initial_pose: "0 0 -1 0 0 0"
    publish_null_when_lost: true
    approx_sync: true
    approx_sync_max_interval: 0.025
    topic_queue_size: 3
    sync_queue_size: 8
    qos: 1
    qos_camera_info: 1
    wait_for_transform: 0.2
    expected_update_rate: 0.0
    "Odom/Strategy": "1"
    # Recover after a short correspondence outage instead of keeping a
    # failed frame as the reference indefinitely.
    "Odom/ResetCountdown": "3"
    "Odom/GuessMotion": "false"
    "Reg/Force3DoF": "false"
    "Vis/FeatureType": "1"
    "Vis/MaxFeatures": "1500"
    "Vis/MinInliers": "30"
    "Vis/MaxDepth": "8.0"
    "Vis/CorType": "1"
    "Vis/CorFlowMinEigThreshold": "0.000001"
    "SIFT/ContrastThreshold": "0.01"
